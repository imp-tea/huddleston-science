{% extends 'base.html' %}{% block content %}<div class="quiz"><p class="eyebrow">RECOGNITION PRACTICE · QUESTION {{ item.position }} OF {{ session.total }}</p><progress value="{{ session.answered }}" max="{{ session.total }}" aria-label="Questions answered"></progress><p class="muted">{{ session.answered }} answers saved · You can leave and return anytime.</p><h1 class="question">{{ item.revision.payload.question }}</h1><form method="post" action="{% url 'scholars:answer' session.pk item.position %}" class="panel answers">{% csrf_token %}{{ form.as_p }}<button>Check answer →</button></form><a href="{% url 'scholars:history' %}">Save and leave</a></div>{% endblock %}
