{% if citations %}<section class="citations"><h2>Study-note attribution</h2>{% for source in citations %}<p><a href="{{ source.url }}" rel="noreferrer">{{ source.title }}</a> · {{ source.publisher }} · <a href="{{ source.license_url }}" rel="noreferrer">{{ source.license }}</a>{% if source.revision.revid %} · Revision {{ source.revision.revid }}{% endif %}</p>{% endfor %}</section>{% endif %}
