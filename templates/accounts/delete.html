{% extends 'base.html' %}{% block content %}<div class="narrow"><h1>Delete {{ student.username }}?</h1><p>This permanently deletes this student’s account, answers, and quiz results. Disabling the account keeps their history.</p><form method="post" class="panel">{% csrf_token %}<input type="hidden" name="confirm" value="{{ student.pk }}"><button>Delete account and history</button> <a href="{% url 'student' student.pk %}">Cancel</a></form></div>{% endblock %}
